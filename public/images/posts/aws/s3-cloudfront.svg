<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="S3와 CloudFront 조회 및 업로드 경로">
<title>S3와 CloudFront 조회 및 업로드 경로</title>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c8496"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b8ff8"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="519" rx="20" fill="#0f1420" stroke="#222a3b"/>
<g font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif"><text x="48" y="62" font-size="24" font-weight="700" fill="#eceef4" text-anchor="start">S3 · CloudFront: 저장과 전달, 업로드 경로 나누기</text><text x="48" y="92" font-size="15" font-weight="400" fill="#a3a9b8" text-anchor="start">조회는 CDN을 거치고, 업로드는 서버가 발급한 Presigned URL로 S3에 직접</text><rect x="48" y="118" width="96" height="26" rx="13" fill="rgba(99,102,241,0.16)"/><text x="96" y="135.5" font-size="12.5" font-weight="600" fill="#8b8ff8" text-anchor="middle">조회 경로</text><rect x="48" y="156" width="190" height="84" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="143" y="193" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">브라우저</text><text x="143" y="217" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">이미지·영상 요청</text><path d="M242 198 L330 198" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arwA)"/><rect x="334" y="156" width="250" height="84" rx="14" fill="rgba(99,102,241,0.08)" stroke="#6366f1" stroke-width="1.2"/><text x="459" y="193" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">CloudFront</text><text x="459" y="217" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">엣지 캐시 · HTTPS(ACM)</text><path d="M588 198 L690 198" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arwA)"/><text x="639" y="186" font-size="13" font-weight="650" fill="#8b8ff8" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace">OAC</text><rect x="694" y="156" width="250" height="84" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="819" y="193" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">S3 (비공개 버킷)</text><text x="819" y="217" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">버킷 정책: 지정 배포만 허용</text><text x="968" y="192" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="start">캐시 미스일 때만</text><text x="968" y="212" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="start">원본까지 요청</text><rect x="48" y="278" width="106" height="26" rx="13" fill="rgba(52,211,153,0.12)"/><text x="101" y="295.5" font-size="12.5" font-weight="600" fill="#34d399" text-anchor="middle">업로드 경로</text><rect x="48" y="316" width="190" height="84" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="143" y="353" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">브라우저</text><text x="143" y="377" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">파일 선택</text><path d="M242 340 L330 340" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><text x="286" y="330" font-size="12.5" font-weight="400" fill="#7c8496" text-anchor="middle">① 요청</text><rect x="334" y="316" width="250" height="84" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="459" y="343" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">API 서버</text><text x="459" y="367" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">권한 확인 · 경로·크기 제한</text><text x="459" y="387" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">Presigned URL 발급</text><path d="M330 380 L242 380" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><text x="286" y="398" font-size="12.5" font-weight="400" fill="#7c8496" text-anchor="middle">② URL</text><path d="M143 400 C 143 470, 819 470, 819 244" stroke="#34d399" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><text x="480" y="488" font-size="13" font-weight="400" fill="#34d399" text-anchor="middle">③ PUT — AWS 키 없이 S3에 직접 업로드 (유효기간·작업 범위 제한)</text></g>
</svg>