<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="SQS 비동기 처리와 DLQ">
<title>SQS 비동기 처리와 DLQ</title>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c8496"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b8ff8"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="419" rx="20" fill="#0f1420" stroke="#222a3b"/>
<g font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif"><text x="48" y="62" font-size="24" font-weight="700" fill="#eceef4" text-anchor="start">SQS로 느린 작업을 응답에서 분리하기</text><text x="48" y="92" font-size="15" font-weight="400" fill="#a3a9b8" text-anchor="start">주문 결과는 먼저 돌려주고, 알림은 워커가 나중에 처리한다</text><rect x="48" y="140" width="170" height="84" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="133" y="177" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">주문 API</text><text x="133" y="201" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">요청 처리</text><path d="M222 182 L278 182" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arwA)"/><rect x="282" y="140" width="170" height="84" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="367" y="177" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">DB 저장</text><text x="367" y="201" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">주문 확정</text><path d="M456 182 L512 182" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arwA)"/><rect x="516" y="140" width="170" height="84" rx="14" fill="rgba(99,102,241,0.08)" stroke="#6366f1" stroke-width="1.2"/><text x="601" y="177" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">SQS</text><text x="601" y="201" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">메시지 보관</text><path d="M690 182 L746 182" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arwA)"/><rect x="750" y="140" width="190" height="84" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="845" y="177" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">워커</text><text x="845" y="201" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">주문 ID로 처리 여부 확인</text><path d="M944 182 L1000 182" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arwA)"/><rect x="1004" y="140" width="148" height="84" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="1078" y="187" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">이메일 발송</text><text x="48" y="262" font-size="13.5" font-weight="400" fill="#34d399" text-anchor="start">사용자는 여기서 바로 응답을 받는다</text><rect x="750" y="300" width="190" height="70" rx="14" fill="rgba(251,113,133,0.12)" stroke="rgba(251,113,133,0.5)" stroke-width="1.2"/><text x="845" y="330" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">DLQ</text><text x="845" y="354" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">반복 실패 메시지 격리</text><path d="M845 228 L845 296" stroke="#fb7185" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><text x="860" y="268" font-size="12.5" font-weight="400" fill="#fb7185" text-anchor="start">재시도 초과</text><text x="48" y="340" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="start">표준 큐는 순서·중복 없는 전달을 보장하지 않음 → 멱등 처리 필요</text><text x="48" y="366" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="start">DB 저장 후 메시지 전송만 실패할 수도 있음 → 큐와 업무 정합성은 별개</text></g>
</svg>