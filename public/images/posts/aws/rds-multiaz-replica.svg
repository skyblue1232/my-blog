<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="RDS Multi-AZ와 Read Replica 비교">
<title>RDS Multi-AZ와 Read Replica 비교</title>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d828c"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9dff"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="399" rx="12" fill="#14161a" stroke="#24272e"/>
<g font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif"><text x="48" y="62" font-size="24" font-weight="700" fill="#e7e8eb" text-anchor="start">Multi-AZ와 Read Replica는 목적이 다르다</text><text x="48" y="92" font-size="15" font-weight="400" fill="#a3a7b0" text-anchor="start">장애 대응을 위한 복제와 읽기 분산을 위한 복제</text><rect x="48" y="120" width="540" height="250" rx="18" fill="#1b1e23" stroke="#30343c" stroke-width="1.2"/><text x="76" y="158" font-size="18" font-weight="700" fill="#e7e8eb" text-anchor="start">Multi-AZ 인스턴스</text><rect x="291" y="140" width="92" height="26" rx="13" fill="rgba(139,157,255,0.14)"/><text x="337" y="157.5" font-size="12.5" font-weight="600" fill="#8b9dff" text-anchor="middle">장애 대응</text><rect x="76" y="186" width="190" height="70" rx="14" fill="#1b1e23" stroke="#6f84ff" stroke-width="1.2"/><text x="171" y="216" font-size="17" font-weight="650" fill="#e7e8eb" text-anchor="middle">Primary</text><text x="171" y="240" font-size="13.5" font-weight="400" fill="#a3a7b0" text-anchor="middle">읽기 · 쓰기</text><rect x="370" y="186" width="190" height="70" rx="14" fill="#1b1e23" stroke="#30343c" stroke-width="1.2"/><text x="465" y="216" font-size="17" font-weight="650" fill="#e7e8eb" text-anchor="middle">Standby</text><text x="465" y="240" font-size="13.5" font-weight="400" fill="#a3a7b0" text-anchor="middle">다른 AZ</text><path d="M270 221 L366 221" stroke="#7d828c" stroke-width="1.8" fill="none" marker-end="url(#arwA)"/><text x="318" y="211" font-size="12.5" font-weight="400" fill="#8b9dff" text-anchor="middle">동기</text><text x="76" y="296" font-size="14" font-weight="400" fill="#a3a7b0" text-anchor="start">장애 시 Standby로 자동 전환</text><text x="76" y="322" font-size="14" font-weight="400" fill="#fb7185" text-anchor="start">Standby는 조회 분산에 쓰지 않는다</text><rect x="612" y="120" width="540" height="250" rx="18" fill="#1b1e23" stroke="#30343c" stroke-width="1.2"/><text x="640" y="158" font-size="18" font-weight="700" fill="#e7e8eb" text-anchor="start">Read Replica</text><rect x="840" y="140" width="92" height="26" rx="13" fill="rgba(74,222,128,0.12)"/><text x="886" y="157.5" font-size="12.5" font-weight="600" fill="#4ade80" text-anchor="middle">읽기 분산</text><rect x="640" y="186" width="190" height="70" rx="14" fill="#1b1e23" stroke="#6f84ff" stroke-width="1.2"/><text x="735" y="216" font-size="17" font-weight="650" fill="#e7e8eb" text-anchor="middle">Primary</text><text x="735" y="240" font-size="13.5" font-weight="400" fill="#a3a7b0" text-anchor="middle">쓰기</text><rect x="934" y="186" width="190" height="70" rx="14" fill="#1b1e23" stroke="#30343c" stroke-width="1.2"/><text x="1029" y="216" font-size="17" font-weight="650" fill="#e7e8eb" text-anchor="middle">Replica</text><text x="1029" y="240" font-size="13.5" font-weight="400" fill="#a3a7b0" text-anchor="middle">읽기 전용</text><path d="M834 221 L930 221" stroke="#7d828c" stroke-width="1.8" fill="none" marker-end="url(#arwA)"/><text x="882" y="211" font-size="12.5" font-weight="400" fill="#8b9dff" text-anchor="middle">비동기</text><text x="640" y="296" font-size="14" font-weight="400" fill="#a3a7b0" text-anchor="start">조회 요청을 복제본으로 분산</text><text x="640" y="322" font-size="14" font-weight="400" fill="#4ade80" text-anchor="start">복제 지연 → 최신 값과 다를 수 있다</text></g>
</svg>