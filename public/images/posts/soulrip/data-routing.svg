<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="데이터 종류별 조회 방식">
<title>데이터 종류별 조회 방식</title>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c8496"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b8ff8"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1199" height="429" rx="20" fill="#0f1420" stroke="#222a3b"/>
<g font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif"><text x="48" y="62" font-size="24" font-weight="700" fill="#eceef4" text-anchor="start">모든 데이터를 RAG에 넣지 않는다</text><text x="48" y="92" font-size="15" font-weight="400" fill="#a3a9b8" text-anchor="start">데이터의 모양에 따라 가져오는 방법을 나눈 뒤, 프롬프트 컨텍스트에서 합친다</text><rect x="48" y="128" width="300" height="72" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="198" y="159" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">장소 · 축제 · 커뮤니티 글</text><text x="198" y="183" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">구조화 데이터</text><path d="M352 164 L412 164" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><rect x="416" y="128" width="250" height="72" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="541" y="169" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">SQL 조건 조회</text><text x="690" y="154" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="start">일정·주소·좌표는 정확한 값이 중요</text><path d="M672 170 L986 170" stroke="#2a3347" stroke-dasharray="5 5" stroke-width="1.5"/><rect x="48" y="220" width="300" height="72" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="198" y="251" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">관광 가이드 · 공식 문서 · 후기</text><text x="198" y="275" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">비정형 텍스트</text><path d="M352 256 L412 256" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><rect x="416" y="220" width="250" height="72" rx="14" fill="rgba(99,102,241,0.08)" stroke="#6366f1" stroke-width="1.2"/><text x="541" y="261" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">임베딩 검색 (RAG)</text><text x="690" y="246" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="start">표현이 달라도 의미로 찾아야 함</text><path d="M672 262 L986 262" stroke="#2a3347" stroke-dasharray="5 5" stroke-width="1.5"/><rect x="48" y="312" width="300" height="72" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="198" y="343" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">날씨 · 혼잡도</text><text x="198" y="367" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">실시간 수치</text><path d="M352 348 L412 348" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><rect x="416" y="312" width="250" height="72" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="541" y="353" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">외부 API 조회</text><text x="690" y="338" font-size="14" font-weight="400" fill="#a3a9b8" text-anchor="start">시점이 지나면 틀린 정보가 됨</text><path d="M672 354 L986 354" stroke="#2a3347" stroke-dasharray="5 5" stroke-width="1.5"/><rect x="1004" y="128" width="148" height="256" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="1078" y="251" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">프롬프트</text><text x="1078" y="275" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">컨텍스트</text><path d="M986 170 L1000 170" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><path d="M986 262 L1000 262" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><path d="M986 354 L1000 354" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/></g>
</svg>