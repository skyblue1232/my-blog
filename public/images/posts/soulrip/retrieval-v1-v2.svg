text><text x="959" y="419" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">요약·추천·팁·출처 형식</text><text x="48" y="476" font-size="13.5" font-weight="400" fill="#34d399" text-anchor="start">변화: 의미가 가까운 문서를 근거로 쓰고, 근거가 없으면 모른다고 답한다</text></g>
