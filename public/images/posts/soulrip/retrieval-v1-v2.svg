<g font-family="'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif"><text x="48" y="62" font-size="24" font-weight="700" fill="#eceef4" text-anchor="start">챗봇 검색 구조의 변화</text><text x="48" y="92" font-size="15" font-weight="400" fill="#a3a9b8" text-anchor="start">키워드가 겹쳐야 찾던 v1에서, 의미로 찾고 출처로 답하는 v2로</text><rect x="48" y="130" width="150" height="26" rx="13" fill="rgba(251,113,133,0.12)"/><text x="123" y="147.5" font-size="12.5" font-weight="600" fill="#fb7185" text-anchor="middle">v1 · 2026.07</text><rect x="48" y="170" width="238" height="96" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="167" y="213" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">사용자 질문</text><text x="167" y="237" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">외국어면 한국어로 번역</text><path d="M289 218 L309 218" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><rect x="312" y="170" width="238" height="96" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="431" y="213" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">조사·불용어 제거</text><text x="431" y="237" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">검색어 최대 8개</text><path d="M553 218 L573 218" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><rect x="576" y="170" width="238" height="96" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="695" y="213" font-size="17" font-weight="650" fill="#eceef4" text-anchor="middle">SQLite ILIKE 검색</text><text x="695" y="237" font-size="13.5" font-weight="400" fill="#a3a9b8" text-anchor="middle">제목·주소·유형 매칭</text><path d="M817 218 L837 218" stroke="#7c8496" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><rect x="840" y="170" width="238" height="96" rx="14" fill="#151b29" stroke="#2a3347" stroke-width="1.2"/><text x="959" y="213" font-size="17" font-weight="650" 