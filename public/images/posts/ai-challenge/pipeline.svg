le</text><text x="598" y="235" font-size="13.5" font-weight="400" fill="#a3a7b0" text-anchor="middle">Prompt control</text><text x="518" y="168" font-size="12.5" font-weight="400" fill="#8b9dff" text-anchor="start" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace">03</text><path d="M700 206 L722 206" stroke="#7d828c" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><rect x="726" y="140" width="196" height="132" rx="14" fill="#1b1e23" stroke="#30343c" stroke-width="1.2"/><text x="824" y="191" font-size="17" font-weight="650" fill="#e7e8eb" text-anchor="middle">검증</text><text x="824" y="215" font-size="13.5" font-weight="400" fill="#a3a7b0" text-anchor="middle">1,000 Holdout</text><text x="824" y="235" font-size="13.5" font-weight="400" fill="#a3a7b0" text-anchor="middle">Checkpoint 비교</text><text x="744" y="168" font-size="12.5" font-weight="400" fill="#8b9dff" text-anchor="start" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace">04</text><path d="M926 206 L948 206" stroke="#7d828c" stroke-width="1.8" fill="none" marker-end="url(#arw)"/><rect x="952" y="140" width="196" height="132" rx="14" fill="rgba(139,157,255,0.08)" stroke="#6f84ff" stroke-width="1.2"/><text x="1050" y="191" font-size="17" font-weight="650" fill="#e7e8eb" text-anchor="middle">후처리</text><text x="1050" y="215" font-size="13.5" font-weight="400" fill="#a3a7b0" text-anchor="middle">모델 기반 blend</text><text x="1050" y="235" font-size="13.5" font-weight="400" fill="#a3a7b0" text-anchor="middle">불일치 구간만</text><text x="970" y="168" font-size="12.5" font-weight="400" fill="#8b9dff" text-anchor="start" font-family="'Geist Mono', ui-monospace, Consolas, Menlo, monospace">05</text></g>
